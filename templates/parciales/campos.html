{% for error in form.non_field_errors %}<p class="aviso aviso-error">{{ error }}</p>{% endfor %}
{% for campo in form %}
  <div class="campo{% if campo.errors %} campo-error{% endif %}">
    <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
    {{ campo }}
    {% if campo.help_text %}<div class="ayuda">{{ campo.help_text|safe }}</div>{% endif %}
    {% for error in campo.errors %}<p class="error">{{ error }}</p>{% endfor %}
  </div>
{% endfor %}
